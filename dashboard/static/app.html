<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <script src="/static/crypto.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #050b12;
      --bg-2: #0a1620;
      --panel: rgba(10, 18, 27, 0.9);
      --panel-strong: rgba(9, 19, 29, 0.96);
      --surface: rgba(15, 27, 38, 0.88);
      --surface-2: rgba(8, 17, 25, 0.9);
      --border: rgba(126, 197, 255, 0.22);
      --border-strong: rgba(126, 197, 255, 0.42);
      --accent: #6fe3ff;
      --accent-strong: #3ecbff;
      --accent-soft: rgba(110, 227, 255, 0.14);
      --text: #eaf8ff;
      --muted: #7fa3bb;
      --green: #44ffb9;
      --green-soft: rgba(68,255,185,0.12);
      --amber: #ffd166;
      --red: #ff6d7a;
      --shadow: rgba(0, 0, 0, 0.48);
    }
    html, body {
      height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at top, rgba(25, 98, 134, 0.2), transparent 34%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(119, 182, 220, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(119, 182, 220, 0.03) 1px, transparent 1px);
      background-size: 24px 24px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
    }

    header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(7, 12, 18, 0.82);
      backdrop-filter: blur(8px);
      box-shadow: inset 0 -1px 0 rgba(255,255,255,0.03);
    }
    .brand-cluster { display: flex; align-items: center; gap: 12px; }
    .logo {
      font-size: 15px; font-weight: 800; letter-spacing: 5px; text-transform: uppercase;
      color: var(--text);
      padding: 7px 10px;
      border-radius: 10px;
      background: rgba(12, 27, 37, 0.9);
      border: 1px solid var(--border-strong);
      box-shadow: inset 0 0 0 1px rgba(110, 227, 255, 0.1);
    }
    .logo em { color: var(--accent); font-style: normal; }
    .model-badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 6px 8px;
      background: rgba(12, 24, 31, 0.8);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .conversation-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(12, 26, 34, 0.75);
      border: 1px solid var(--border);
    }
    .pill {
      display: flex; align-items: center; gap: 7px;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(16, 25, 34, 0.9);
      border: 1px solid var(--border);
      font-size: 10px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase;
      color: var(--muted);
      transition: all 0.3s;
    }
    .pill.on {
      background: rgba(13, 39, 31, 0.9);
      border-color: rgba(68,255,185,0.4);
      color: var(--green);
      box-shadow: 0 0 0 1px rgba(68,255,185,0.08), 0 0 20px rgba(68,255,185,0.15);
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
    .pill.on .dot { background: var(--green); animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.45} }
    .spacer { flex: 1; }
    .enc-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 1.5px; padding: 4px 8px;
      border-radius: 6px; display: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }
    .enc-badge.on  { display: block; background: rgba(68,255,185,0.12); border: 1px solid rgba(68,255,185,0.3); color: var(--green); }
    .enc-badge.off { display: block; background: rgba(255,109,122,0.08); border: 1px solid rgba(255,109,122,0.2); color: var(--red); }
    .url {
      font-size: 10px; font-family: SFMono-Regular, ui-monospace, monospace; color: var(--muted);
      padding: 5px 9px; background: rgba(13, 24, 33, 0.7); border: 1px solid var(--border); border-radius: 6px;
    }

    .overview-grid {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px; padding: 12px 18px 0;
    }
    .overview-card {
      background: linear-gradient(180deg, rgba(13, 19, 30, 0.96), rgba(10, 18, 26, 0.94));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      min-height: 96px;
      display: flex; flex-direction: column; justify-content: space-between;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.02), 0 0 0 1px rgba(110,227,255,0.02);
    }
    .overview-label {
      color: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.6px;
    }
    .overview-value {
      font-size: clamp(22px, 2vw, 30px); font-weight: 800; color: var(--text);
      line-height: 1.1;
    }
    .overview-sub { color: var(--muted); font-size: 11px; line-height: 1.4; }

    .health-panel {
      background: rgba(12, 20, 29, 0.9);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin: 12px 18px 8px;
      padding: 12px 14px 10px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
    }
    .health-header {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      margin-bottom: 10px;
    }
    .health-failure {
      color: #fca5a5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .health-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px;
    }
    .health-row {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 10px; font-size: 12px; color: var(--muted);
    }
    .health-row strong { color: var(--text); font-weight: 700; text-transform: lowercase; }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 12px 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    main::-webkit-scrollbar { width: 8px; }
    main::-webkit-scrollbar-track { background: transparent; }
    main::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(116, 192, 255, 0.6), rgba(66,128,180,0.4));
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 2px 2px;
    }
    .quick-action {
      border: 1px solid var(--border);
      background: rgba(14, 25, 35, 0.8);
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .quick-action:hover {
      color: var(--text);
      border-color: var(--border-strong);
      background: rgba(20, 39, 50, 0.85);
      box-shadow: inset 0 0 0 1px rgba(122, 219, 255, 0.09), 0 0 16px rgba(110, 227, 255, 0.08);
    }

    .msg {
      max-width: 82%;
      padding: 12px 14px 11px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
      animation: pop 0.18s ease;
      border: 1px solid rgba(255,255,255,0.02);
    }
    @keyframes pop { from { opacity:0; transform:translateY(4px); } }

    .msg-j {
      align-self: flex-start;
      background: linear-gradient(180deg, rgba(16, 30, 42, 0.94), rgba(9, 17, 24, 0.96));
      border-color: rgba(110, 227, 255, 0.18);
      border-bottom-left-radius: 6px;
    }
    .msg-u {
      align-self: flex-end;
      background: linear-gradient(180deg, rgba(20, 61, 79, 0.9), rgba(11, 27, 36, 0.96));
      border-color: rgba(110, 227, 255, 0.3);
      border-bottom-right-radius: 6px;
    }
    .msg-sys {
      align-self: center;
      font-size: 11px;
      color: var(--muted);
      padding: 4px 10px;
      background: rgba(13, 24, 33, 0.55);
      border: 1px solid var(--border);
      border-radius: 999px;
      letter-spacing: 0.4px;
    }
    .lbl {
      font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      opacity: 0.7; margin-bottom: 5px;
    }
    .msg-j .lbl { color: var(--accent); }
    .msg-u .lbl { color: var(--muted); text-align: right; }

    .msg pre, .msg code {
      background: rgba(4, 10, 14, 0.62);
      border: 1px solid rgba(126,197,255,0.18);
      border-radius: 10px;
      padding: 8px 10px;
      font-family: SFMono-Regular, ui-monospace, monospace;
      font-size: 12px;
      line-height: 1.5;
    }
    .msg code {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .msg pre {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 8px 0;
      overflow-x: auto;
    }

    .msg-file {
      align-self: flex-end;
      background: rgba(11, 22, 30, 0.9);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      border-bottom-right-radius: 4px;
      padding: 11px 14px;
      display: flex; align-items: center; gap: 12px;
      max-width: 82%; animation: pop 0.18s ease;
      box-shadow: 0 12px 28px rgba(0,0,0,0.2);
    }
    .fc-icon { font-size: 26px; flex-shrink: 0; }
    .fc-meta { flex: 1; min-width: 0; }
    .fc-lbl  { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; color:var(--muted); margin-bottom:4px; }
    .fc-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fc-size { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .fc-bar-wrap { height: 3px; background: rgba(255,255,255,0.05); border-radius: 2px; margin-top: 7px; overflow: hidden; }
    .fc-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-strong)); border-radius: 2px; transition: width 0.12s linear; }
    .fc-status { font-size: 10px; font-weight: 700; letter-spacing: 1px; flex-shrink: 0; color: var(--muted); }
    .fc-status.done { color: var(--green); }
    .fc-status.err  { color: var(--red); }
    .fc-dl { display:block; margin-top:6px; font-size:11px; color:var(--accent); text-decoration:none; font-weight:600; }
    .fc-dl:hover { opacity: 0.8; }

    footer {
      flex-shrink:0;
      padding: 12px 18px 16px;
      border-top:1px solid var(--border);
      background: rgba(7, 12, 18, 0.82);
      backdrop-filter: blur(8px);
      display:flex; gap:10px; align-items:center;
    }
    .composer {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      background: rgba(12, 25, 35, 0.9);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 7px 10px;
      box-shadow: inset 0 0 0 1px rgba(110,227,255,0.04);
    }
    #inp {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    #inp::placeholder { color: var(--muted); }
    .btn { padding:11px 15px; border:none; border-radius:12px; font-size:11px; font-weight:700; letter-spacing:1.5px; cursor:pointer; transition:opacity 0.15s,transform 0.1s; }
    .btn:active { transform: scale(0.96); }
    .btn:hover  { opacity: 0.88; }
    .btn-send {
      background: linear-gradient(135deg, rgba(76, 193, 255, 0.95), rgba(48, 128, 255, 0.95));
      color: #04141b;
      box-shadow: 0 12px 20px rgba(48,128,255,0.25);
    }
    .btn-wake { background:rgba(13, 31, 25, 0.9); border:1px solid rgba(68,255,185,0.4); color:var(--green); display:none; }
    .btn-wake.show { display:block; }
    .btn-attach, #mic-btn {
      background: rgba(17, 31, 42, 0.9);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .btn-attach:hover, #mic-btn:hover {
      color: var(--accent);
      border-color: var(--border-strong);
      background: rgba(20, 37, 48, 0.9);
    }
    #mic-btn.recording {
      background: rgba(255, 109, 122, 0.12);
      border-color: rgba(255,109,122,0.4);
      color: var(--red);
      animation: mic-pulse 1s ease-in-out infinite;
    }
    #mic-btn.unsupported { opacity: 0.3; cursor: not-allowed; }
    @keyframes mic-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.65;transform:scale(0.97)} }

    #toast {
      position:fixed; top:66px; left:50%; transform:translateX(-50%) translateY(-8px);
      background:rgba(34,197,94,0.16); border:1px solid rgba(34,197,94,0.4);
      color:var(--green); font-size:12px; font-weight:700; letter-spacing:1px;
      padding:7px 18px; border-radius:99px;
      opacity:0; transition:opacity 0.22s,transform 0.22s;
      pointer-events:none; white-space:nowrap;
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    @media (max-width: 700px) {
      .overview-grid { grid-template-columns: 1fr; }
      .msg { max-width: 92%; }
      .msg-file { max-width: 92%; }
      header { flex-wrap: wrap; }
      .brand-cluster { width: 100%; }
      .spacer { display: none; }
      .url { display: none; }
      footer { flex-wrap: wrap; }
      .composer { flex-basis: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div id="toast"></div>
  <header>
    <div class="brand-cluster">
      <div class="logo"><em>X</em>yrus</div>
      <div class="model-badge">Live Session</div>
      <div class="conversation-title">Command Center</div>
    </div>
    <div class="spacer"></div>
    <div class="pill" id="pill"><span class="dot"></span><span id="st">Connecting</span></div>
    <div class="enc-badge" id="enc">AES-256</div>
    <div class="url">__IP__:__PORT__</div>
  </header>
  <section class="overview-grid" aria-label="Assistant overview">
    <div class="overview-card">
      <div class="overview-label">Memory</div>
      <div class="overview-value" id="overview-memory">0</div>
      <div class="overview-sub">stored user facts</div>
    </div>
    <div class="overview-card">
      <div class="overview-label">Tasks</div>
      <div class="overview-value" id="overview-tasks">0</div>
      <div class="overview-sub">open follow-ups</div>
    </div>
    <div class="overview-card">
      <div class="overview-label">Status</div>
      <div class="overview-value" id="overview-status">Live</div>
      <div class="overview-sub">assistant health</div>
    </div>
  </section>
  <section class="health-panel" aria-label="Health panel">
    <div class="health-header">
      <span>System health</span>
      <span id="health-last-failure" class="health-failure">No recent failures</span>
    </div>
    <div class="health-grid">
      <div class="health-row"><span>Mic</span><strong id="health-mic">ok</strong></div>
      <div class="health-row"><span>Speaker</span><strong id="health-speaker">ok</strong></div>
      <div class="health-row"><span>Camera</span><strong id="health-camera">ok</strong></div>
      <div class="health-row"><span>Memory</span><strong id="health-memory">ok</strong></div>
      <div class="health-row"><span>Model ladder</span><strong id="health-model">ok</strong></div>
      <div class="health-row"><span>Plugin load state</span><strong id="health-plugins">ready</strong></div>
    </div>
  </section>
  <main id="feed">
    <div class="quick-actions" aria-label="Quick actions">
      <button class="quick-action" type="button">Web Search</button>
      <button class="quick-action" type="button">Write</button>
      <button class="quick-action" type="button">Code</button>
      <button class="quick-action" type="button">Summarize</button>
      <button class="quick-action" type="button">Images</button>
      <button class="quick-action" type="button">Tools</button>
    </div>
  </main>
  <footer>
    <div class="composer">
      <input id="inp" placeholder="Send a command…" autocomplete="off">
      <label class="btn-attach" for="file-inp" title="Send file">📎</label>
      <input type="file" id="file-inp" multiple accept="*/*" style="display:none">
      <button id="mic-btn" onclick="doMic()" title="Voice command">🎤</button>
    </div>
    <button class="btn btn-wake" id="wake" onclick="doWake()">WAKE</button>
    <button class="btn btn-send" onclick="doSend()">SEND</button>
  </footer>

  <script>
    // ── Auth — bearer token ───────────────────────────────────────────────────
    const _authToken  = sessionStorage.getItem('jarvis_token');
    const _sessionKey = sessionStorage.getItem('jarvis_key');

    if (!_authToken) {
      location.replace('/login');
    }

    function _authHeader() { return { 'Authorization': `Bearer ${_authToken}` }; }
    function _authFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers, _authHeader());
      return fetch(url, opts);
    }

    // ── AES-256-CBC encryption (CryptoJS) ────────────────────────────────────
    const _AES_SALT = 'JARVIS-DASHBOARD-v1';
    let _aesKey = null;

    function _initCrypto(key) {
      if (typeof CryptoJS === 'undefined') return false;
      _aesKey = CryptoJS.SHA256(key + _AES_SALT);
      return true;
    }

    function _encrypt(plaintext) {
      if (!_aesKey || typeof CryptoJS === 'undefined') return null;
      try {
        const iv  = CryptoJS.lib.WordArray.random(16);
        const enc = CryptoJS.AES.encrypt(
          CryptoJS.enc.Utf8.parse(plaintext), _aesKey,
          { iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );
        const ivHex = iv.toString(CryptoJS.enc.Hex);
        const ctHex = enc.ciphertext.toString(CryptoJS.enc.Hex);
        const hex   = ivHex + ctHex;
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < bytes.length; i++)
          bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        return btoa(String.fromCharCode(...bytes));
      } catch { return null; }
    }

    const _encReady = _sessionKey ? _initCrypto(_sessionKey) : false;
    const encBadge  = document.getElementById('enc');
    if (_encReady) { encBadge.className = 'enc-badge on'; }
    else           { encBadge.className = 'enc-badge off'; encBadge.textContent = 'NO ENC'; }

    // ── WebSocket ─────────────────────────────────────────────────────────────
    const feed  = document.getElementById('feed');
    const pill  = document.getElementById('pill');
    const stTxt = document.getElementById('st');
    const wake  = document.getElementById('wake');

    const _wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const _wsUrl   = `${_wsProto}://${location.host}/ws?token=${encodeURIComponent(_authToken)}`;
    const ws       = new WebSocket(_wsUrl);

    ws.onopen    = () => { sys('Remote session active.'); toast('Connected to assistant'); };
    ws.onclose   = () => sys('Connection lost — refresh to reconnect.');
    ws.onerror   = () => sys('Connection error.');
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'log')           append(m.speaker, m.text);
      if (m.type === 'status')        setStatus(m.state);
      if (m.type === 'wake')          sys('Wake word detected — connecting…');
      if (m.type === 'sys')           sys(m.text);
      if (m.type === 'file_received') _onFileReceived(m);
    };

    function setStatus(s) {
      if (s === 'active') {
        pill.className = 'pill on'; stTxt.textContent = 'Active'; wake.classList.remove('show');
        document.getElementById('overview-status').textContent = 'Live';
      } else {
        pill.className = 'pill'; stTxt.textContent = 'Sleeping'; wake.classList.add('show');
        document.getElementById('overview-status').textContent = 'Idle';
      }
    }

    function setOverviewStats(memoryCount = 0, taskCount = 0) {
      const memoryEl = document.getElementById('overview-memory');
      const taskEl = document.getElementById('overview-tasks');
      if (memoryEl) memoryEl.textContent = String(memoryCount);
      if (taskEl) taskEl.textContent = String(taskCount);
    }

    function renderHealth(status = {}) {
      const mapping = {
        mic: document.getElementById('health-mic'),
        speaker: document.getElementById('health-speaker'),
        camera: document.getElementById('health-camera'),
        memory: document.getElementById('health-memory'),
        model_ladder: document.getElementById('health-model'),
        plugin_load_state: document.getElementById('health-plugins'),
      };
      for (const [key, el] of Object.entries(mapping)) {
        if (el) el.textContent = status[key] || 'unknown';
      }
      const failureEl = document.getElementById('health-last-failure');
      if (failureEl) {
        const msg = status.last_failure ? String(status.last_failure) : 'No recent failures';
        failureEl.textContent = msg;
      }
    }

    async function refreshHealth() {
      try {
        const resp = await _authFetch('/api/health');
        if (!resp.ok) return;
        const data = await resp.json();
        renderHealth(data || {});
      } catch (err) {
        // health endpoint is optional and should never break the dashboard
      }
    }

    setOverviewStats(12, 3);
    renderHealth({
      mic: 'ok', speaker: 'ok', camera: 'ok', memory: 'ok', model_ladder: 'ok', plugin_load_state: 'ready'
    });
    refreshHealth();
    setInterval(refreshHealth, 10000);

    function append(speaker, text) {
      const d = document.createElement('div');
      if (speaker === 'jarvis') {
        d.className = 'msg msg-j';
        d.innerHTML = `<div class="lbl">Assistant</div>${esc(text)}`;
      } else {
        d.className = 'msg msg-u';
        d.innerHTML = `<div class="lbl">You</div>${esc(text)}`;
      }
      feed.appendChild(d);
      feed.scrollTop = feed.scrollHeight;
    }

    function sys(text) {
      const d = document.createElement('div');
      d.className = 'msg msg-sys'; d.textContent = text;
      feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── File helpers ──────────────────────────────────────────────────────────
    function _fileIcon(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      if (['jpg','jpeg','png','gif','webp','heic','heif','avif','bmp','svg'].includes(ext)) return '🖼️';
      if (['mp4','mov','avi','mkv','webm','m4v','3gp'].includes(ext))                       return '🎬';
      if (['mp3','m4a','wav','flac','aac','ogg','opus'].includes(ext))                      return '🎵';
      if (['pdf'].includes(ext))                                                             return '📋';
      if (['doc','docx','txt','md','rtf','odt'].includes(ext))                              return '📝';
      if (['xls','xlsx','csv','ods'].includes(ext))                                         return '📊';
      if (['ppt','pptx','odp'].includes(ext))                                               return '📑';
      if (['zip','rar','7z','tar','gz','bz2','xz'].includes(ext))                          return '📦';
      if (['apk','exe','dmg','deb','rpm','msi'].includes(ext))                              return '⚙️';
      return '📎';
    }

    function _fmtSize(bytes) {
      if (bytes < 1024)             return bytes + ' B';
      if (bytes < 1024 * 1024)     return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 ** 3)       return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      return (bytes / 1024 ** 3).toFixed(2) + ' GB';
    }

    // ── File upload (phone → computer) ────────────────────────────────────────
    function _uploadFile(file) {
      const id = 'fc_' + Date.now() + '_' + Math.random().toString(36).slice(2);

      // Create file card in feed
      const card = document.createElement('div');
      card.className = 'msg-file';
      card.id = id;
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(file.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Sending</div>
          <div class="fc-name">${esc(file.name)}</div>
          <div class="fc-size">${_fmtSize(file.size)}</div>
          <div class="fc-bar-wrap"><div class="fc-bar" id="${id}_bar"></div></div>
        </div>
        <div class="fc-status" id="${id}_st">0%</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${_authToken}`);

      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const pct = Math.round(e.loaded / e.total * 100);
        const bar = document.getElementById(`${id}_bar`);
        const st  = document.getElementById(`${id}_st`);
        if (bar) bar.style.width = pct + '%';
        if (st)  st.textContent  = pct + '%';
      };

      xhr.onload = () => {
        const bar  = document.getElementById(`${id}_bar`);
        const st   = document.getElementById(`${id}_st`);
        const meta = card.querySelector('.fc-meta');
        const lbl  = card.querySelector('.fc-lbl');
        if (xhr.status === 200) {
          let savedName = file.name;
          try { savedName = JSON.parse(xhr.responseText).name || file.name; } catch {}
          const dlUrl = `/uploads/${encodeURIComponent(savedName)}?token=${encodeURIComponent(_authToken)}`;
          if (bar)  { bar.style.width = '100%'; bar.style.background = 'var(--green)'; }
          if (st)   { st.textContent = '✓'; st.className = 'fc-status done'; }
          if (lbl)  lbl.textContent = 'Sent';
          if (meta) meta.insertAdjacentHTML('beforeend',
            `<a class="fc-dl" href="${dlUrl}" download="${esc(savedName)}">⬇ Download back</a>`);
          toast('File sent!');
        } else {
          let errMsg = 'Upload failed';
          try { errMsg = JSON.parse(xhr.responseText).error || errMsg; } catch {}
          if (bar) bar.style.background = '#f87171';
          if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
          if (lbl) lbl.textContent = errMsg;
        }
      };

      xhr.onerror = () => {
        const st  = document.getElementById(`${id}_st`);
        const lbl = card.querySelector('.fc-lbl');
        if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
        if (lbl) lbl.textContent = 'Connection error';
      };

      const fd = new FormData();
      fd.append('file', file);
      xhr.send(fd);
    }

    // File received by another WebSocket client (e.g., second open tab)
    function _onFileReceived(m) {
      const dlUrl = `/uploads/${encodeURIComponent(m.name)}?token=${encodeURIComponent(_authToken)}`;
      const card  = document.createElement('div');
      card.className = 'msg-file';
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(m.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Received</div>
          <div class="fc-name">${esc(m.name)}</div>
          <div class="fc-size">${_fmtSize(m.size)}</div>
          <a class="fc-dl" href="${dlUrl}" download="${esc(m.name)}">⬇ Download</a>
        </div>
        <div class="fc-status done">✓</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      toast('File received on computer!');
    }

    // File input change handler
    document.getElementById('file-inp').addEventListener('change', function () {
      Array.from(this.files).forEach(_uploadFile);
      this.value = ''; // reset so the same file can be re-sent
    });

    // ── Commands ──────────────────────────────────────────────────────────────
    function doSend() {
      const inp = document.getElementById('inp');
      const txt = inp.value.trim();
      if (!txt) return;
      inp.value = '';
      append('user', txt);
      const enc  = _encrypt(txt);
      const body = enc ? { enc } : { text: txt };
      _authFetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }

    function doWake() {
      sys('Sending wake signal…');
      _authFetch('/api/wake', { method: 'POST' });
    }

    document.getElementById('inp').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
    });

    // ── Toast ─────────────────────────────────────────────────────────────────
    let _toastTimer;
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    // ── Real-time Voice — PCM16 WebSocket → Gemini Live ──────────────────────
    const micBtn  = document.getElementById('mic-btn');
    let _voiceWs  = null;
    let _audioCtx = null;
    let _micStm   = null;
    let _audioNd  = null;

    function _micIdle() {
      micBtn.innerHTML = '🎤';
      micBtn.title     = 'Voice — tap to speak';
      micBtn.classList.remove('recording');
    }

    // Float32 PCM → resample to 16 kHz + convert to Int16
    function _f32toPcm16(f32, srcRate) {
      let s = f32;
      if (srcRate !== 16000) {
        const ratio = srcRate / 16000;
        const len   = Math.round(f32.length / ratio);
        s = new Float32Array(len);
        for (let i = 0; i < len; i++)
          s[i] = f32[Math.min(Math.round(i * ratio), f32.length - 1)];
      }
      const out = new Int16Array(s.length);
      for (let i = 0; i < s.length; i++)
        out[i] = Math.max(-32768, Math.min(32767, Math.round(s[i] * 32768)));
      return out.buffer;
    }

    function _showVoiceSetup() {
      if (document.getElementById('voice-setup')) return; // show once
      const origin = location.origin;
      const card = document.createElement('div');
      card.id = 'voice-setup';
      card.style.cssText = [
        'align-self:stretch', 'background:rgba(99,102,241,0.07)',
        'border:1px solid rgba(99,102,241,0.22)', 'border-radius:14px',
        'padding:16px 18px', 'font-size:13px', 'line-height:1.8',
        'animation:pop 0.18s ease'
      ].join(';');
      card.innerHTML =
        '<div style="font-weight:700;color:#818cf8;letter-spacing:.5px;margin-bottom:10px">🎤 One-time voice setup</div>' +
        '<ol style="padding-left:18px;color:#8899aa;margin:0;display:flex;flex-direction:column;gap:4px">' +
        '<li>Open a new tab → go to <span style="background:rgba(255,255,255,0.07);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:12px">chrome://flags</span></li>' +
        '<li>Search: <strong style="color:#dde3ed">Insecure origins treated as secure</strong></li>' +
        '<li>Paste this URL into the box:<br><span id="flags-url" style="background:rgba(255,255,255,0.07);padding:2px 8px;border-radius:4px;font-family:monospace;font-size:11px;user-select:all;cursor:pointer">' + esc(origin) + '</span></li>' +
        '<li>Set to <strong style="color:#22c55e">Enabled</strong> → tap <strong style="color:#dde3ed">Relaunch</strong></li>' +
        '<li>Return here and tap 🎤</li>' +
        '</ol>';
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      // tap to copy
      card.querySelector('#flags-url').addEventListener('click', () => {
        navigator.clipboard?.writeText(origin).then(() => toast('URL copied!')).catch(() => {});
      });
    }

    async function doMic() {
      if (_voiceWs) { _stopVoice(); return; }

      if (!navigator.mediaDevices?.getUserMedia) {
        _showVoiceSetup();
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
      } catch (e) {
        sys(e.name === 'NotAllowedError'
          ? 'Microphone denied — tap the address bar lock and allow microphone.'
          : 'Mic error: ' + e.message);
        return;
      }

      // 16 kHz context (fall back to native rate — _f32toPcm16 resamples)
      let ctx;
      try { ctx = new AudioContext({ sampleRate: 16000 }); }
      catch (_) { ctx = new AudioContext(); }
      if (ctx.state === 'suspended') await ctx.resume();

      const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(
        `${wsProto}://${location.host}/ws/phone-audio?token=${encodeURIComponent(_authToken)}`
      );
      ws.binaryType = 'arraybuffer';

      ws.onopen = async () => {
        const rate = ctx.sampleRate;
        const src  = ctx.createMediaStreamSource(stream);

        // AudioWorklet (modern) — runs in dedicated audio thread
        const wCode = `class J extends AudioWorkletProcessor{process(i){const c=i[0]?.[0];if(c)this.port.postMessage(c.slice());return true;}}registerProcessor('j',J);`;
        try {
          const burl = URL.createObjectURL(new Blob([wCode], { type: 'application/javascript' }));
          await ctx.audioWorklet.addModule(burl);
          URL.revokeObjectURL(burl);
          const nd = new AudioWorkletNode(ctx, 'j');
          // Buffer to 1024 samples (64 ms at 16 kHz) before sending —
          // matches PC mic chunk size, prevents queue flooding on the server.
          let _pbuf = [], _plen = 0;
          nd.port.onmessage = e => {
            const chunk = new Int16Array(_f32toPcm16(e.data, rate));
            _pbuf.push(chunk); _plen += chunk.length;
            if (_plen >= 1024) {
              const out = new Int16Array(_plen); let off = 0;
              for (const c of _pbuf) { out.set(c, off); off += c.length; }
              if (ws.readyState === 1) ws.send(out.buffer);
              _pbuf = []; _plen = 0;
            }
          };
          src.connect(nd);
          _audioNd = nd;
        } catch (_) {
          // ScriptProcessor fallback (deprecated, still works everywhere)
          const sp = ctx.createScriptProcessor(4096, 1, 1);
          sp.onaudioprocess = e => {
            if (ws.readyState === 1) ws.send(_f32toPcm16(e.inputBuffer.getChannelData(0), rate));
          };
          src.connect(sp); sp.connect(ctx.destination);
          _audioNd = sp;
        }

        micBtn.innerHTML = '⏹';
        micBtn.title     = 'Tap to stop';
        micBtn.classList.add('recording');
        sys('Voice live — speak now');
        toast('🎤 Live');
      };

      ws.onclose = () => { _stopVoice(); };
      ws.onerror = () => { sys('Voice connection failed.'); _stopVoice(); };

      _voiceWs  = ws;
      _audioCtx = ctx;
      _micStm   = stream;
    }

    function _stopVoice() {
      if (_audioNd)  { try { _audioNd.disconnect(); }  catch (_) {}; _audioNd  = null; }
      if (_audioCtx) { try { _audioCtx.close(); }      catch (_) {}; _audioCtx = null; }
      if (_micStm)   { _micStm.getTracks().forEach(t => t.stop()); _micStm = null; }
      if (_voiceWs)  {
        const w = _voiceWs; _voiceWs = null;
        if (w.readyState < 2) w.close();
      }
      _micIdle();
    }
  </script>
</body>
